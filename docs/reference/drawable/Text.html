<!doctype html>
<html lang="ru">
<head>
  <!-- База прибита гвоздями: после pushState на /раздел/урок относительные
       пути (content/…, app.js, ../reference/) продолжают считаться от корня
       раздела, а не от нового адреса. -->
  <base href="../">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>drawable.Text — Документация Idyllium</title>
  <meta name="description" content="Текстовый Canvas-объект с выбранным шрифтом, размером, цветом, origin и вращением.">
  <link rel="icon" href="../assets/favicon-32x32.png" sizes="32x32">
  <link rel="icon" href="../assets/idyllium.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="reference-topbar">
    <div class="topbar-left">
      <button class="menu-toggle" id="menu-toggle" type="button" title="Показать навигацию" aria-label="Показать навигацию">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <a class="brand" href="https://github.com/Aumphaadr/Idyllium" target="_blank" rel="noopener" title="Idyllium на GitHub">
        <span class="brand-mark">I</span>
        <span>Idyllium</span>
        <span class="version" id="version">v1.5.1</span>
      </a>
      <span class="section-badge">Документация</span>
    </div>
    <nav class="topbar-actions" aria-label="Основные разделы">
      <a href="../">Открыть IDE</a>
      <a href="../book/">Учебник</a>
      <button id="theme-toggle" type="button" title="Светлая тема" aria-label="Светлая тема"><svg class="icon-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5 5l1.9 1.9M17.1 17.1L19 19M19 5l-1.9 1.9M6.9 17.1L5 19"/></svg><svg class="icon-moon" viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true"><path d="M20.6 14.8A8.7 8.7 0 0 1 9.2 3.4a8.7 8.7 0 1 0 11.4 11.4z"/></svg></button>
    </nav>
  </header>

  <div class="reference-shell">
    <aside class="reference-sidebar" id="reference-sidebar">
      <div class="sidebar-search">
        <label for="reference-search">Поиск по API</label>
        <input id="reference-search" type="search" autocomplete="off" placeholder="Например: set_image">
      </div>
      <nav id="reference-nav" class="reference-nav" aria-label="Документация Idyllium"></nav>
    </aside>

    <main class="reference-main" id="reference-main" tabindex="-1">
      <article id="reference-view" class="reference-view">
        <div class="loading-state">Загрузка документации...</div>
      </article>
    </main>
  </div>
</body>
</html>
