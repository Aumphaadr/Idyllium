<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- База прибита гвоздями: после pushState на /раздел/урок относительные
       пути (content/…, app.js, ../reference/) продолжают считаться от корня
       раздела, а не от нового адреса. -->
  <base href="./">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idyllium - Учебник</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="fonts/fonts.css">
  <!-- @site-nav-assets -->
  <link rel="stylesheet" href="app.css">
  <script src="version.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <!-- @site-topbar -->

  <div class="docs-shell">
    <aside class="docs-sidebar" id="docs-sidebar">
      <div class="sidebar-head">
        <label class="search-box">
          <span>Поиск</span>
          <input id="lesson-search" type="search" autocomplete="off" placeholder="Найти урок">
        </label>
      </div>
      <nav class="lesson-nav" id="lesson-nav" aria-label="Уроки"></nav>
    </aside>

    <main class="docs-main" id="docs-main" tabindex="-1">
      <article class="lesson-view" id="lesson-view">
        <div class="loading-card">Загрузка учебника...</div>
      </article>
    </main>

    <aside class="docs-toc" id="docs-toc" aria-label="Разделы урока"></aside>
  </div>
</body>
</html>
