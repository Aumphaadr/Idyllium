<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- База прибита гвоздями: после pushState на /раздел/урок относительные
       пути (content/…, app.js, ../reference/) продолжают считаться от корня
       раздела, а не от нового адреса. -->
  <base href="./">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Idyllium - Учебник</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <!-- @site-nav-assets -->
  <link rel="stylesheet" href="app.css">
  <script src="../gui-renderer/icons.js"></script>
  <script src="version.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <!-- @site-topbar -->

  <div class="docs-shell">
    <aside class="ui-sidebar docs-sidebar" id="docs-sidebar">
      <div class="ui-sidebar-head sidebar-head">
        <label class="ui-sidebar-label search-box" for="lesson-search">Поиск</label>
        <div class="ui-search">
          <input id="lesson-search" class="ui-field ui-field--lg" type="search" autocomplete="off" placeholder="Найти урок">
          <button id="lesson-search-clear" class="ui-search-clear" type="button" hidden title="Очистить" aria-label="Очистить поиск"></button>
        </div>
      </div>
      <nav class="ui-sidebar-nav lesson-nav" id="lesson-nav" aria-label="Уроки"></nav>
    </aside>

    <main class="docs-main" id="docs-main" tabindex="-1">
      <article class="lesson-view" id="lesson-view">
        <div class="ui-state loading-card">Загрузка учебника...</div>
      </article>
    </main>

    <aside class="ui-toc docs-toc" id="docs-toc" aria-label="Разделы урока"></aside>
  </div>
</body>
</html>
