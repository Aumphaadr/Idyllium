<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Idyllium</title>
  <link rel="stylesheet" href="frame.css">
</head>
<body>
  <main id="unit" class="unit" hidden>
    <section id="statement" class="statement" hidden></section>
    <section class="editor-shell">
      <div id="editor" class="editor"></div>
    </section>
    <div class="toolbar">
      <!-- Значки — единый набор сайта (tools/build-icons.js); сборка подставляет svg на место data-icon. -->
      <button id="run" class="ui-button ui-button--run" type="button"><i class="icon" data-icon="play-fill" data-size="16"></i><span class="label"></span></button>
      <button id="stop" class="ui-button ui-button--stop" type="button" hidden><i class="icon" data-icon="stop-fill" data-size="16"></i><span class="label"></span></button>
      <button id="check" class="ui-button ui-button--tonal" type="button" hidden><i class="icon" data-icon="circle-check" data-size="16"></i><span class="label"></span></button>
      <span class="toolbar-gap"></span>
      <button id="format" class="ui-button ui-button--quiet" type="button"><i class="icon" data-icon="align-left" data-size="16"></i><span class="label"></span></button>
      <button id="open-in-ide" class="ui-button ui-button--quiet" type="button"><i class="icon" data-icon="external-link" data-size="16"></i><span class="label"></span></button>
      <button id="reset" class="ui-button ui-button--quiet" type="button"><i class="icon" data-icon="rotate-ccw" data-size="16"></i><span class="label"></span></button>
    </div>
    <section id="console" class="console" aria-live="polite">
      <pre id="output" class="output"></pre>
      <!-- Не <form>: песочница без allow-forms молча глушит отправку форм. -->
      <div id="input-row" class="input-row" hidden>
        <input id="input" class="ui-field ui-field--mono input" type="text" autocomplete="off" spellcheck="false">
        <button id="input-send" class="ui-button" type="button"><span class="label"></span></button>
      </div>
    </section>
    <section id="verdict" class="verdict" hidden></section>
    <a id="branding" class="branding" href="https://aumphaadr.github.io/Idyllium/" target="_blank" rel="noopener noreferrer" hidden></a>
  </main>
  <main id="broken" class="broken" hidden></main>
  <script src="frame.js"></script>
</body>
</html>
