name: Deploy Pages

# Деплой сайта (docs/ уже собран и лежит в git) на GitHub Pages.
# Запускается ТОЛЬКО по явному желанию — обычные пуши в main сайт НЕ
# трогают, чтобы можно было часто пушить код методистам. Три пути:
#   - npm run deploy (локальная команда: force-пуш HEAD в ветку deploy —
#     она служит и указателем «какой коммит сейчас на сайте»);
#   - кнопка Run workflow во вкладке Actions;
#   - релизный тег vX.Y.Z (сайт и релиз синхронны).
#
# ВАЖНО: этот воркфлоу начинает управлять публикацией только после
# переключения Settings → Pages → Source на «GitHub Actions»; пока там
# «Deploy from a branch», сайт по-прежнему выкатывается каждым пушем.
#
# ЗАЩИТА ОКРУЖЕНИЯ: environment github-pages по умолчанию разрешает
# деплой только с выбранных веток — тег v1.5.5 отбило именно это
# («not allowed to deploy … due to environment protection rules»,
# 2026-08-29). Разовая настройка: Settings → Environments → github-pages
# → Deployment branches and tags → добавить tag-правило «v*» и
# branch-правило «deploy» (для npm run deploy).

on:
  workflow_dispatch:
  push:
    branches: [deploy]
    tags: ['v*.*.*']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Публикация docs/ на Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - id: deployment
        uses: actions/deploy-pages@v4
