name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Сборка и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Тесты (компилятор, рантайм, спецификация учебника)
        run: npm test

      - name: Сборка сайта документации и WebIDE
        run: npm run docs:site

      - name: Проверка чистоты docs/ после пересборки
        run: |
          # Пересборка сайта из закоммиченных исходников не должна менять
          # docs/ — иначе закоммиченный сайт разошёлся с исходниками и его
          # забыли перегенерировать. Игнорируются только строки с
          # generatedAt-таймстампами (-I), а не целые файлы: содержательный
          # дрейф api.json и lessons.json теперь тоже ловится.
          git diff -I '"generatedAt"' --stat --exit-code docs/ || {
            echo '::error::docs/ разошёлся с исходниками — запустите npm run docs:site и закоммитьте результат'
            exit 1
          }
